<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>미니 워들 게임 (한/영 겸용)</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #121213;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            margin: 0;
            padding: 10px;
            box-sizing: border-box;
        }
        header {
            text-align: center;
            border-bottom: 1px solid #3a3a3c;
            width: 100%;
            max-width: 500px;
            padding-bottom: 10px;
        }
        h1 { margin: 5px 0; font-size: 24px; letter-spacing: 2px; }
        
        #board {
            display: grid;
            grid-template-rows: repeat(6, 1fr);
            grid-gap: 5px;
            padding: 10px;
            box-sizing: border-box;
        }
        .row {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-gap: 5px;
        }
        .tile {
            width: 50px;
            height: 50px;
            border: 2px solid #3a3a3c;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
            user-select: none;
            background-color: #121213;
            text-transform: uppercase;
        }
        .tile.filled { border-color: #565758; }
        .tile.correct { background-color: #538d4e; border-color: #538d4e; color: white; }
        .tile.present { background-color: #b59f3b; border-color: #b59f3b; color: white; }
        .tile.absent { background-color: #3a3a3c; border-color: #3a3a3c; color: white; }

        #keyboard {
            width: 100%;
            max-width: 500px;
            margin-bottom: 20px;
        }
        .keyboard-row {
            display: flex;
            justify-content: center;
            gap: 4px;
            margin-bottom: 8px;
        }
        button.key {
            background-color: #818384;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 14px 0;
            flex: 1;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
        }
        button.key.wide { flex: 1.5; }

        #message {
            position: fixed;
            top: 60px;
            background-color: white;
            color: black;
            padding: 10px 20px;
            border-radius: 4px;
            font-weight: bold;
            display: none;
            z-index: 100;
        }
        
        #share-container {
            display: none;
            margin-top: 15px;
            text-align: center;
        }
        #share-btn {
            background-color: #538d4e;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <h1>WORDLE</h1>
        <div id="sub-title">5글자 단어를 맞추세요 (한글/영문 지원)</div>
    </header>

    <div id="message"></div>

    <div id="board"></div>

    <div id="share-container">
        <button id="share-btn" onclick="shareResult()">결과 복사하기 (SNS 공유)</button>
    </div>

    <!-- 가상 키보드 -->
    <div id="keyboard">
        <div class="keyboard-row">
            <button class="key" onclick="inputChar('ㅂ')">ㅂ</button>
            <button class="key" onclick="inputChar('ㅈ')">ㅈ</button>
            <button class="key" onclick="inputChar('ㄷ')">ㄷ</button>
            <button class="key" onclick="inputChar('ㄱ')">ㄱ</button>
            <button class="key" onclick="inputChar('ㅅ')">ㅅ</button>
            <button class="key" onclick="inputChar('ㅛ')">ㅛ</button>
            <button class="key" onclick="inputChar('ㅕ')">ㅕ</button>
            <button class="key" onclick="inputChar('ㅑ')">ㅑ</button>
            <button class="key" onclick="inputChar('ㅐ')">ㅐ</button>
            <button class="key" onclick="inputChar('ㅔ')">ㅔ</button>
        </div>
        <div class="keyboard-row">
            <button class="key" onclick="inputChar('ㅁ')">ㅁ</button>
            <button class="key" onclick="inputChar('ㄴ')">ㄴ</button>
            <button class="key" onclick="inputChar('ㅇ')">ㅇ</button>
            <button class="key" onclick="inputChar('ㄹ')">ㄹ</button>
            <button class="key" onclick="inputChar('ㅎ')">ㅎ</button>
            <button class="key" onclick="inputChar('ㅗ')">ㅗ</button>
            <button class="key" onclick="inputChar('ㅓ')">ㅓ</button>
            <button class="key" onclick="inputChar('ㅏ')">ㅏ</button>
            <button class="key" onclick="inputChar('ㅣ')">ㅣ</button>
        </div>
        <div class="keyboard-row">
            <button class="key wide" onclick="handleEnter()">입력</button>
            <button class="key" onclick="inputChar('ㅋ')">ㅋ</button>
            <button class="key" onclick="inputChar('ㅌ')">ㅌ</button>
            <button class="key" onclick="inputChar('ㅊ')">ㅊ</button>
            <button class="key" onclick="inputChar('ㅍ')">ㅍ</button>
            <button class="key" onclick="inputChar('ㅠ')">ㅠ</button>
            <button class="key" onclick="inputChar('ㅜ')">ㅜ</button>
            <button class="key" onclick="inputChar('ㅡ')">ㅡ</button>
            <button class="key wide" onclick="handleBackspace()">지우기</button>
        </div>
    </div>

    <script>
        // 정답 설정 (한글 5글자 또는 영어 5글자 선택 가능)
        const ANSWER = "오렌지주스"; 
        const WORD_LENGTH = 5;
        const MAX_ROWS = 6;
        
        let currentRow = 0;
        let currentTile = 0;
        let boardState = Array(MAX_ROWS).fill("").map(() => Array(WORD_LENGTH).fill(""));
        let isGameOver = false;
        let guessHistory = [];

        // 한글 오토마타 변수
        let currentCho = -1;
        let currentJung = -1;
        let currentJong = -1;

        const CHOSUNG = ['ㄱ', 'ㄲ', 'ㄴ', 'ㄷ', 'ㄸ', 'ㄹ', 'ㅁ', 'ㅂ', 'ㅃ', 'ㅅ', 'ㅆ', 'ㅇ', 'ㅈ', 'ㅉ', 'ㅊ', 'ㅋ', 'ㅌ', 'ㅍ', 'ㅎ'];
        const JUNGSUNG = ['ㅏ', 'ㅐ', 'ㅑ', 'ㅒ', 'ㅓ', 'ㅔ', 'ㅕ', 'ㅖ', 'ㅗ', 'ㅘ', 'ㅙ', 'ㅚ', 'ㅛ', 'ㅜ', 'ㅝ', 'ㅞ', 'ㅟ', 'ㅠ', 'ㅡ', 'ㅢ', 'ㅣ'];
        const JONGSUNG = ['', 'ㄱ', 'ㄲ', 'ㄳ', 'ㄴ', 'ㄵ', 'ㄶ', 'ㄷ', 'ㄹ', 'ㄺ', 'ㄻ', 'ㄼ', 'ㄽ', 'ㄾ', 'ㄿ', 'ㅀ', 'ㅁ', 'ㅂ', 'ㅄ', 'ㅅ', 'ㅆ', 'ㅇ', 'ㅈ', 'ㅊ', 'ㅋ', 'ㅌ', 'ㅍ', 'ㅎ'];

        const CHO_MAP = {'ㄱ':0, 'ㄲ':1, 'ㄴ':2, 'ㄷ':3, 'ㄸ':4, 'ㄹ':5, 'ㅁ':6, 'ㅂ':7, 'ㅃ':8, 'ㅅ':9, 'ㅆ':10, 'ㅇ':11, 'ㅈ':12, 'ㅉ':13, 'ㅊ':14, 'ㅋ':15, 'ㅌ':16, 'ㅍ':17, 'ㅎ':18};
        const JUNG_MAP = {'ㅏ':0, 'ㅐ':1, 'ㅑ':2, 'ㅒ':3, 'ㅓ':4, 'ㅔ':5, 'ㅕ':6, 'ㅖ':7, 'ㅗ':8, 'ㅛ':12, 'ㅜ':13, 'ㅠ':17, 'ㅡ':18, 'ㅣ':20};
        const JONG_MAP = {'ㄱ':1, 'ㄴ':4, 'ㄷ':7, 'ㄹ':8, 'ㅁ':16, 'ㅂ':17, 'ㅅ':19, 'ㅇ':21, 'ㅈ':22, 'ㅊ':23, 'ㅋ':24, 'ㅌ':25, 'ㅍ':26, 'ㅎ':27};
        const JUNG_COMBO = {
            'ㅗ': {'ㅏ': 'ㅘ', 'ㅐ': 'ㅙ', 'ㅣ': 'ㅚ'},
            'ㅜ': {'ㅓ': 'ㅝ', 'ㅔ': 'ㅞ', 'ㅣ': 'ㅟ'},
            'ㅡ': {'ㅣ': 'ㅢ'}
        };

        // 보드판 생성
        const board = document.getElementById("board");
        for (let r = 0; r < MAX_ROWS; r++) {
            let row = document.createElement("div");
            row.className = "row";
            for (let c = 0; c < WORD_LENGTH; c++) {
                let tile = document.createElement("div");
                tile.className = "tile";
                tile.id = `tile-${r}-${c}`;
                row.appendChild(tile);
            }
            board.appendChild(row);
        }

        function getCombinedKorean() {
            if (currentCho !== -1 && currentJung === -1 && currentJong === -1) return CHOSUNG[currentCho];
            if (currentCho === -1 && currentJung !== -1 && currentJong === -1) return JUNGSUNG[currentJung];
            if (currentCho !== -1 && currentJung !== -1) {
                let code = 44032 + (currentCho * 588) + (currentJung * 28) + (currentJong === -1 ? 0 : currentJong);
                return String.fromCharCode(code);
            }
            return "";
        }

        function updateUI() {
            if (currentTile >= WORD_LENGTH) return;
            let tile = document.getElementById(`tile-${currentRow}-${currentTile}`);
            let text = getCombinedKorean();
            tile.textContent = text;
            if (text !== "") {
                tile.classList.add("filled");
                boardState[currentRow][currentTile] = text;
            } else {
                tile.classList.remove("filled");
                boardState[currentRow][currentTile] = "";
            }
        }

        // 공통 입력 처리기 (한글 자모음 또는 영어 알파벳)
        function inputChar(char) {
            if (isGameOver) return;

            // 영어 입력 처리 (A-Z)
            if (/^[a-zA-Z]$/.test(char)) {
                if (currentTile >= WORD_LENGTH) return;
                let upperChar = char.toUpperCase();
                boardState[currentRow][currentTile] = upperChar;
                let tile = document.getElementById(`tile-${currentRow}-${currentTile}`);
                tile.textContent = upperChar;
                tile.classList.add("filled");
                currentTile++;
                return;
            }

            // 한글 자모음 오토마타 처리
            if (CHO_MAP[char] !== undefined || JUNG_MAP[char] !== undefined || JONG_MAP[char] !== undefined) {
                if (currentCho === -1 && currentJung === -1 && currentJong === -1) {
                    if (CHO_MAP[char] !== undefined) currentCho = CHO_MAP[char];
                    else if (JUNG_MAP[char] !== undefined) currentJung = JUNG_MAP[char];
                    updateUI();
                } else if (currentCho !== -1 && currentJung === -1 && currentJong === -1) {
                    if (JUNG_MAP[char] !== undefined) {
                        currentJung = JUNG_MAP[char];
                        updateUI();
                    } else if (CHO_MAP[char] !== undefined) {
                        commitLetter();
                        currentCho = CHO_MAP[char];
                        updateUI();
                    }
                } else if (currentCho !== -1 && currentJung !== -1 && currentJong === -1) {
                    let jungChar = JUNGSUNG[currentJung];
                    if (JUNG_COMBO[jungChar] && JUNG_COMBO[jungChar][char]) {
                        currentJung = JUNG_MAP[JUNG_COMBO[jungChar][char]];
                        updateUI();
                    } else if (JONG_MAP[char] !== undefined) {
                        currentJong = JONG_MAP[char];
                        updateUI();
                    } else if (CHO_MAP[char] !== undefined) {
                        commitLetter();
                        currentCho = CHO_MAP[char];
                        updateUI();
                    } else if (JUNG_MAP[char] !== undefined) {
                        commitLetter();
                        currentJung = JUNG_MAP[char];
                        updateUI();
                    }
                } else if (currentCho !== -1 && currentJung !== -1 && currentJong !== -1) {
                    if (CHO_MAP[char] !== undefined) {
                        commitLetter();
                        currentCho = CHO_MAP[char];
                        updateUI();
                    } else if (JUNG_MAP[char] !== undefined) {
                        currentJong = -1;
                        commitLetter();
                        currentJung = JUNG_MAP[char];
                        updateUI();
                    }
                }
            }
        }

        function commitLetter() {
            let text = getCombinedKorean();
            if (text !== "") {
                boardState[currentRow][currentTile] = text;
                currentTile++;
                currentCho = -1;
                currentJung = -1;
                currentJong = -1;
            }
        }

        function handleBackspace() {
            if (isGameOver) return;

            // 영어 입력 칸 지우기
            let tile = document.getElementById(`tile-${currentRow}-${currentTile > 0 ? currentTile - 1 : 0}`);
            if (currentCho === -1 && currentJung === -1 && currentJong === -1) {
                if (currentTile > 0) {
                    currentTile--;
                    boardState[currentRow][currentTile] = "";
                    let t = document.getElementById(`tile-${currentRow}-${currentTile}`);
                    t.textContent = "";
                    t.classList.remove("filled");
                }
                return;
            }

            // 한글 자모음 조합 지우기
            if (currentJong !== -1) { currentJong = -1; updateUI(); }
            else if (currentJung !== -1) { currentJung = -1; updateUI(); }
            else if (currentCho !== -1) { currentCho = -1; updateUI(); }
        }

        function handleEnter() {
            if (isGameOver) return;
            
            let text = getCombinedKorean();
            if (text !== "" && currentTile < WORD_LENGTH) {
                boardState[currentRow][currentTile] = text;
                currentTile++;
                currentCho = -1; currentJung = -1; currentJong = -1;
            }

            if (currentTile < WORD_LENGTH) {
                showMessage("단어의 글자 수가 부족합니다!");
                return;
            }

            let currentWord = boardState[currentRow].join("");
            guessHistory.push(currentWord);

            let answerArr = ANSWER.split("");
            let rowResult = Array(WORD_LENGTH).fill("absent");
            
            for (let i = 0; i < WORD_LENGTH; i++) {
                if (currentWord[i] === answerArr[i]) {
                    rowResult[i] = "correct";
                    answerArr[i] = null;
                }
            }

            for (let i = 0; i < WORD_LENGTH; i++) {
                if (rowResult[i] === "correct") continue;
                let index = answerArr.indexOf(currentWord[i]);
                if (index !== -1) {
                    rowResult[i] = "present";
                    answerArr[index] = null;
                }
            }

            for (let i = 0; i < WORD_LENGTH; i++) {
                let tile = document.getElementById(`tile-${currentRow}-${i}`);
                tile.classList.add(rowResult[i]);
            }

            if (currentWord === ANSWER) {
                showMessage("정답입니다! 🎉");
                endGame(true);
                return;
            }

            currentRow++;
            currentTile = 0;
            currentCho = -1; currentJung = -1; currentJong = -1;

            if (currentRow === MAX_ROWS) {
                showMessage(`게임 오버! 정답은 [ ${ANSWER} ] 입니다.`);
                endGame(false);
            }
        }

        function showMessage(msg) {
            let m = document.getElementById("message");
            m.textContent = msg;
            m.style.display = "block";
            setTimeout(() => { m.style.display = "none"; }, 2000);
        }

        function endGame(won) {
            isGameOver = true;
            document.getElementById("share-container").style.display = "block";
        }

        // 물리 키보드 입력 대응 (영어 알파벳 및 한글 자모음 매핑)
        const koreanMap = {
            'q': 'ㅂ', 'Q': 'ㅃ', 'w': 'ㅈ', 'W': 'ㅉ', 'e': 'ㄷ', 'E': 'ㄸ', 'r': 'ㄱ', 'R': 'ㄲ', 't': 'ㅅ', 'T': 'ㅆ',
            'y': 'ㅛ', 'u': 'ㅕ', 'i': 'ㅑ', 'o': 'ㅐ', 'O': 'ㅒ', 'p': 'ㅔ', 'P': 'ㅖ',
            'a': 'ㅁ', 's': 'ㄴ', 'd': 'ㅇ', 'f': 'ㄹ', 'g': 'ㅎ', 'h': 'ㅗ', 'j': 'ㅓ', 'k': 'ㅏ', 'l': 'ㅣ',
            'z': 'ㅋ', 'x': 'ㅌ', 'c': 'ㅊ', 'v': 'ㅍ', 'b': 'ㅠ', 'n': 'ㅜ', 'm': 'ㅡ'
        };

        window.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                handleEnter();
            } else if (e.key === 'Backspace') {
                handleBackspace();
            } else if (koreanMap[e.key]) {
                inputChar(koreanMap[e.key]);
            } else if (/^[a-zA-Z]$/.test(e.key)) {
                inputChar(e.key);
            }
        });

        // SNS 공유 기능
        function shareResult() {
            let resultText = `미니 워들 (${currentRow + (isGameOver && guessHistory[guessHistory.length-1] === ANSWER ? 0 : 6)}/${MAX_ROWS})\n\n`;
            
            guessHistory.forEach(word => {
                let answerArr = ANSWER.split("");
                let tempRow = Array(WORD_LENGTH).fill("⬛");
                
                for (let i = 0; i < WORD_LENGTH; i++) {
                    if (word[i] === answerArr[i]) {
                        tempRow[i] = "🟩";
                        answerArr[i] = null;
                    }
                }
                for (let i = 0; i < WORD_LENGTH; i++) {
                    if (tempRow[i] === "🟩") continue;
                    let idx = answerArr.indexOf(word[i]);
                    if (idx !== -1) {
                        tempRow[i] = "🟨";
                        answerArr[idx] = null;
                    }
                }
                resultText += tempRow.join("") + "\n";
            });

            navigator.clipboard.writeText(resultText).then(() => {
                alert("결과가 클립보드에 복사되었습니다!");
            });
        }
    </script>
</body>
</html>
